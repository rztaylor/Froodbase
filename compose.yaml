# Local Froodbase stack: PostgreSQL 16, froodbase-api and froodbase-dreamer.
# Start it with `make up` (creates .env from .env.example on first run); the
# FROODBASE_ variables are documented in .env.example and
# docs/dev/ops/development.md. froodbase-mcp runs on the host, not here.
name: froodbase

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${FROODBASE_DB_USER:-froodbase}
      POSTGRES_PASSWORD: ${FROODBASE_DB_PASSWORD:?set FROODBASE_DB_PASSWORD in .env (make up generates one)}
      POSTGRES_DB: ${FROODBASE_DB_NAME:-froodbase}
      # The service role (local/postgres-init creates it on first start).
      FROODBASE_APP_DB_PASSWORD: ${FROODBASE_APP_DB_PASSWORD:?set FROODBASE_APP_DB_PASSWORD in .env (make up generates one)}
    ports:
      - "127.0.0.1:${FROODBASE_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies pending schema migrations (goose, then River's job
  # queue schema) before the api and dreamer start. `make migrate` reruns it.
  migrate:
    build:
      context: .
      args:
        BINARY: froodbase-api
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}
    image: froodbase-api:local
    command: ["migrate"]
    environment:
      FROODBASE_DATABASE_URL: postgres://${FROODBASE_DB_USER:-froodbase}:${FROODBASE_DB_PASSWORD}@postgres:5432/${FROODBASE_DB_NAME:-froodbase}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # The api and dreamer connect as froodbase_app, which owns no table and is
  # subject to row-level security; only the migrate service uses the owner.
  api:
    build:
      context: .
      args:
        BINARY: froodbase-api
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}
    image: froodbase-api:local
    environment:
      FROODBASE_API_ADDR: ":8080"
      FROODBASE_DATABASE_URL: postgres://froodbase_app:${FROODBASE_APP_DB_PASSWORD}@postgres:5432/${FROODBASE_DB_NAME:-froodbase}?sslmode=disable
      FROODBASE_USERS_FILE: /etc/froodbase/users.json
    volumes:
      - ./local/users.json:/etc/froodbase/users.json:ro
    ports:
      - "127.0.0.1:${FROODBASE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  dreamer:
    build:
      context: .
      args:
        BINARY: froodbase-dreamer
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}
    image: froodbase-dreamer:local
    environment:
      FROODBASE_DREAMER_ADDR: ":8081"
      FROODBASE_DATABASE_URL: postgres://froodbase_app:${FROODBASE_APP_DB_PASSWORD}@postgres:5432/${FROODBASE_DB_NAME:-froodbase}?sslmode=disable
    ports:
      - "127.0.0.1:${FROODBASE_DREAMER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
