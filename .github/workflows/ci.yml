name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: make build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: make up
      - name: Check the API health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8080/healthz
      - name: Check the dreamer startup line
        run: docker compose logs dreamer | grep -q "froodbase-dreamer starting"
      - name: Apply migrations
        run: make migrate
      - name: Apply migrations again (nothing to do)
        run: make migrate | grep -q "nothing to apply"
      - name: Check migration status
        run: make migrate-status | grep -E "^ +1 +applied"
      - name: MCP endpoint rejects anonymous requests
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:8080/mcp)
          test "$code" = 401
      - name: whoami answers with the sample user's grants
        run: |
          curl --fail -s -u alice:froodbase-dev -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"whoami","arguments":{}}}' http://127.0.0.1:8080/mcp \
            | grep -q '"reviewer"'
      - name: froodbase-mcp forwards whoami over stdio
        run: |
          make build
          ( printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"whoami","arguments":{}}}'; sleep 3 ) \
            | FROODBASE_API_URL=http://127.0.0.1:8080/mcp FROODBASE_USERNAME=alice FROODBASE_PASSWORD=froodbase-dev bin/froodbase-mcp 2>/dev/null \
            | grep -q '"reviewer"'
      - name: froodbase-mcp reports the API unavailable when it is stopped
        run: |
          docker compose stop api
          ( printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"whoami","arguments":{}}}'; sleep 3 ) \
            | FROODBASE_API_URL=http://127.0.0.1:8080/mcp FROODBASE_USERNAME=alice FROODBASE_PASSWORD=froodbase-dev bin/froodbase-mcp 2>/dev/null \
            | grep -q '"froodbase_unavailable":true'
          docker compose start api
      - name: Check the PostgreSQL extensions are installed
        run: |
          docker compose exec -T postgres psql -U froodbase -d froodbase -tA \
            -c "select count(*) from pg_extension where extname in ('vector', 'pg_trgm', 'btree_gist')" \
            | grep -qx 3
      - name: Show logs
        if: always()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: make down
