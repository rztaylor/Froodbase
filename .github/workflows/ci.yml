name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: make build
      - name: Generated sqlc code is current
        run: make sqlc-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests (Testcontainers PostgreSQL)
        run: make test-integration

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: make up
      - name: Check the API health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8080/healthz
      - name: Check the dreamer startup line
        run: docker compose logs dreamer | grep -q "froodbase-dreamer starting"
      - name: Check the dreamer health endpoint reports queue depth
        run: curl --fail --silent --show-error http://127.0.0.1:8081/healthz | grep -q '"queue_depth"'
      - name: Migrations were applied by the migrate service during make up
        run: docker compose logs migrate | grep -q 'migrations. applied'
      - name: Apply migrations again (nothing to do)
        run: make migrate | grep -q "nothing to apply"
      - name: Check migration status
        run: |
          out=$(make migrate-status)
          echo "$out" | grep -E "^ +1 +applied"
          echo "$out" | grep -E "^ +2 +applied"
          echo "$out" | grep -E "river \(job queue schema\)"
      - name: MCP endpoint rejects anonymous requests
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:8080/mcp)
          test "$code" = 401
      - name: whoami answers with the sample user's grants
        run: |
          curl --fail -s -u alice:froodbase-dev -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"whoami","arguments":{}}}' http://127.0.0.1:8080/mcp \
            | grep -q '"reviewer"'
      - name: contribute writes a change set and get_record reads it back
        run: |
          out=$(curl --fail -s -u bob:froodbase-dev -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"contribute","arguments":{"area":"demo","idempotency_key":"ci-1","entities":[{"ref":"tool","type":"service","names":[{"name":"Import Tool"}]}],"evidence":[{"ref":"t","source_kind":"ticket","source_uri":"https://dev.azure.com/org/p/_workitems/edit/418","source_revision":"r1","access_class":"area"}],"observations":[{"ref":"obs","subject":"tool","body_markdown":"Callback failure reproduced on 2.3","evidence":["t"]}]}}}' \
            http://127.0.0.1:8080/mcp)
          echo "$out" | grep -q '"lifecycle_state":"active"'
          id=$(echo "$out" | python3 -c 'import sys,json; r=json.load(sys.stdin)["result"]["structuredContent"]; print(next(x["id"] for x in r["records"] if x["ref"]=="obs"))')
          curl --fail -s -u carol:froodbase-dev -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"get_record\",\"arguments\":{\"id\":\"$id\"}}}" http://127.0.0.1:8080/mcp \
            | grep -q '"kind":"observation"'
      - name: search finds the entity by a misspelt name and the observation by a body word
        run: |
          curl --fail -s -u carol:froodbase-dev -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search","arguments":{"query":"Improt Tool"}}}' http://127.0.0.1:8080/mcp \
            | grep -q '"candidate":true'
          curl --fail -s -u carol:froodbase-dev -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"search","arguments":{"query":"callback"}}}' http://127.0.0.1:8080/mcp \
            | grep -q '"channel":"full_text"'
      - name: froodbase-mcp forwards whoami over stdio
        run: |
          make build
          ( printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"whoami","arguments":{}}}'; sleep 3 ) \
            | FROODBASE_API_URL=http://127.0.0.1:8080/mcp FROODBASE_USERNAME=alice FROODBASE_PASSWORD=froodbase-dev bin/froodbase-mcp 2>/dev/null \
            | grep -q '"reviewer"'
      - name: froodbase-mcp reports the API unavailable when it is stopped
        run: |
          docker compose stop api
          ( printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"whoami","arguments":{}}}'; sleep 3 ) \
            | FROODBASE_API_URL=http://127.0.0.1:8080/mcp FROODBASE_USERNAME=alice FROODBASE_PASSWORD=froodbase-dev bin/froodbase-mcp 2>/dev/null \
            | grep -q '"froodbase_unavailable":true'
          docker compose start api
      - name: Index job indexed the contributed records and health reports no stale records
        run: |
          for i in $(seq 1 30); do
            stale=$(curl -s http://127.0.0.1:8081/healthz | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["index_stale"] if d["index_total"] > 0 else -1)')
            [ "$stale" = 0 ] && exit 0
            sleep 2
          done
          echo "records still stale"; curl -s http://127.0.0.1:8081/healthz; exit 1
      - name: Heartbeat job completed in the River job table
        run: |
          for i in $(seq 1 30); do
            n=$(docker compose exec -T postgres psql -U froodbase -d froodbase -tA \
              -c "select count(*) from river_job where kind = 'heartbeat' and state = 'completed'")
            [ "$n" -ge 1 ] && exit 0
            sleep 2
          done
          echo "no completed heartbeat"; exit 1
      - name: Check the PostgreSQL extensions are installed
        run: |
          docker compose exec -T postgres psql -U froodbase -d froodbase -tA \
            -c "select count(*) from pg_extension where extname in ('vector', 'pg_trgm', 'btree_gist')" \
            | grep -qx 3
      - name: The api and dreamer run as the service role, which owns nothing
        run: |
          docker compose exec -T postgres psql -U froodbase -d froodbase -tA \
            -c "select count(*) from pg_stat_activity where usename = 'froodbase_app'" | grep -qvx 0
          docker compose exec -T postgres psql -U froodbase -d froodbase -tA \
            -c "select count(*) from pg_tables where tableowner = 'froodbase_app'" | grep -qx 0
      - name: Show logs
        if: always()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: make down
